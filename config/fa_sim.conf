# FaSim-Isaac 共用配置（提交 git，bash 语法，由 init.sh / run.sh source）
# 本机覆盖：复制 fa_sim.local.template.conf 为 fa_sim.local.conf 后修改（已 gitignore）

# --- Isaac Sim 安装 / 启动（run.sh / run_headless.sh）---
# 允许环境变量优先：ISAACSIM_DIR=/path ./run.sh
ISAACSIM_DIR="${ISAACSIM_DIR:-${HOME}/isaacsim}"
ISAACSIM_LAUNCH_NORMAL="isaac-sim.sh"
ISAACSIM_LAUNCH_NEWTON="isaac-sim.newton.sh"
ISAACSIM_LAUNCH_STREAMING="isaac-sim.streaming.sh"
ISAACSIM_LAUNCH_NEWTON_STREAMING="isaac-sim.newton.streaming.sh"

# ./run.sh 使用完整 host ROS2（FASIM_FULL_HOST_ROS=1）时排除的 Kit 扩展。
# apt pinocchio/eigenpy 与 Isaac pink 的 bundled lib 冲突；关 pink 后可保留 /opt/ros LD。
# cache_indicator：streaming kit 默认也排除，一并写上以免 CLI 覆盖数组时丢项。
ISAAC_EXCLUDED_EXTS=(
  "omni.kit.widget.cache_indicator"
  "isaacsim.robot_motion.pink.examples"
  "isaacsim.robot_motion.pink"
)

# --- Kit settings 覆盖（不必改 ~/isaacsim/apps/*.kit 就能做 A/B）---
# 预设档位：./run.sh --kit-profile NAME（--list-kit-profiles 查看全部）
#   none                不追加任何覆盖
#   newton-physx-min    newton 启动项：只关 CUDA graph 物理步进（先验证这条）
#   newton-physx        newton 启动项 + PhysX 运行时：再关异步/手动渲染节流
#   physx-compat        PhysX app：复刻 newton app 的“启动不做全帧同步”
#   physx-compat-full   physx-compat + 关 fast cache / 关节可视化同步
RUN_KIT_PROFILE="${RUN_KIT_PROFILE:-none}"

# Newton 启动项（运行时切回 PhysX）下，这些 Newton app 默认值仍然生效
ISAAC_KIT_PROFILE_NEWTON_PHYSX_MIN=(
  "--/exts/isaacsim.physics.newton/capture_graph_physics_step=false"
)
ISAAC_KIT_PROFILE_NEWTON_PHYSX=(
  "--/exts/isaacsim.physics.newton/capture_graph_physics_step=false"
  "--/exts/isaacsim.core.throttling/enable_async=false"
  "--/exts/isaacsim.core.throttling/enable_manualmode=false"
)

# PhysX app 上复刻 newton.kit 里 [settings.exts."omni.physx"] 的那组开关
ISAAC_KIT_PROFILE_PHYSX_COMPAT=(
  "--/exts/omni.physx/updateToUsd=false"
  "--/exts/omni.physx/updateVelocitiesToUsd=false"
  "--/exts/omni.physx/updateParticlesToUsd=false"
  "--/exts/omni.physx/updateForceSensorsToUsd=false"
  "--/exts/omni.physx/fabricUpdateTransformations=false"
  "--/exts/omni.physx/fabricUpdateVelocities=false"
  "--/exts/omni.physx/fabricUpdateForceSensors=false"
  "--/exts/omni.physx/fabricUpdateJointStates=false"
)
ISAAC_KIT_PROFILE_PHYSX_COMPAT_FULL=(
  "--/exts/omni.physx/updateToUsd=false"
  "--/exts/omni.physx/updateVelocitiesToUsd=false"
  "--/exts/omni.physx/updateParticlesToUsd=false"
  "--/exts/omni.physx/updateForceSensorsToUsd=false"
  "--/exts/omni.physx/fabricUpdateTransformations=false"
  "--/exts/omni.physx/fabricUpdateVelocities=false"
  "--/exts/omni.physx/fabricUpdateForceSensors=false"
  "--/exts/omni.physx/fabricUpdateJointStates=false"
  "--/exts/omni.physx/useFastCache=false"
  "--/exts/omni.physx/outputVelocitiesLocalSpace=false"
  "--/exts/omni.physx/visualizationDisplayJoints=false"
)

# 档位说明（--list-kit-profiles / 交互菜单用）
declare -A ISAAC_KIT_PROFILE_DESC=(
  [newton-physx-min]="newton 启动项：只关 CUDA graph 物理步进（最小改动）"
  [newton-physx]="newton 启动项：关 CUDA graph 步进 + 异步/手动渲染节流"
  [physx-compat]="PhysX 启动项：复刻 newton 的同步开关（关 USD/Fabric 全量同步）"
  [physx-compat-full]="PhysX 启动项：physx-compat + 关 fast cache / 关节可视化同步"
)

# 额外手工覆盖（每项 "--/嵌套/键=值"），追加在预设档位之后
ISAAC_KIT_SETTINGS=(
)

# 1=启动前开启 core dump 并把 crashreport.gui 加入 PATH（崩溃排查用）
# 注意：core_pattern 若不是 core 文件（如 apport），需自行 sysctl 调整
RUN_CRASH_DEBUG="${RUN_CRASH_DEBUG:-0}"

# 物理引擎：physx（普通）| newton（交互可选；写入 fa_sim.local.conf）
RUN_PHYSICS_BACKEND="${RUN_PHYSICS_BACKEND:-physx}"

# 1=强制设置 CPU performance；0=跳过；auto=可用则设（容器内不尝试 apt 安装）
# distrobox 内调频由宿主机内核控制，推荐 auto 或 0；宿主机可执行:
#   sudo cpupower frequency-set -g performance
RUN_SET_CPU_PERFORMANCE="${RUN_SET_CPU_PERFORMANCE:-auto}"

# 启动前 source 的 ROS2 工作空间（含 install/setup.bash）
# robot_common_launch / unitree_*_description 等一般在此；none=不 source
RUN_ROS2_WS="${RUN_ROS2_WS:-${HOME}/ros2_ws}"
# Isaac 官方 jazzy underlay（若存在且与 RUN_ROS2_WS 不同，会先 source）
RUN_ISAAC_ROS_WS="${RUN_ISAAC_ROS_WS:-}"

# --- Headless Streaming 多实例（./run_headless.sh）---
# FA_SIM_INSTANCE=N 时：
#   signalPort = STREAM_SIGNAL_PORT_BASE + N * STREAM_PORT_STEP
#   streamPort = STREAM_STREAM_PORT_BASE + N * STREAM_PORT_STEP
#   ROS_DOMAIN_ID = ROS_DOMAIN_ID_BASE + N
# 例: ./run_headless.sh --instance 1
FA_SIM_INSTANCE="${FA_SIM_INSTANCE:-0}"
STREAM_SIGNAL_PORT_BASE="${STREAM_SIGNAL_PORT_BASE:-49100}"
STREAM_STREAM_PORT_BASE="${STREAM_STREAM_PORT_BASE:-47998}"
STREAM_PORT_STEP="${STREAM_PORT_STEP:-10}"
ROS_DOMAIN_ID_BASE="${ROS_DOMAIN_ID_BASE:-0}"

# --- Isaac ROS2 Workspace（init.sh）---
# 菜单查询远程失败时的备用版本列表（新 → 旧）
ISAAC_SIM_VERSIONS=(
  "6.2.0"
  "6.1.0"
  "6.0.1"
)
# 菜单展示的远程稳定版本数量（排除 -dev / -full 等后缀）
ISAAC_SIM_VERSION_MENU_COUNT="${ISAAC_SIM_VERSION_MENU_COUNT:-3}"
# 默认版本（菜单回车 / 未指定 ISAAC_SIM_VERSION 时使用）。
# 未设置时取解析后的版本列表第一项（通常是远程最新稳定版）。
# ISAAC_SIM_DEFAULT_VERSION="6.0.1"
ISAAC_ROS_WS_GIT_URL="${ISAAC_ROS_WS_GIT_URL:-https://github.com/isaac-sim/IsaacSim-ros_workspaces.git}"
ISAAC_ROS_WS_GIT_TIMEOUT="${ISAAC_ROS_WS_GIT_TIMEOUT:-30}"
ISAAC_ROS_WS_TAG_PREFIX="IsaacSim-"
# %s 会被替换为完整 tag，例如 IsaacSim-5.1.0
ISAAC_ROS_WS_ZIP_URL_TEMPLATE="https://github.com/isaac-sim/IsaacSim-ros_workspaces/archive/refs/tags/%s.zip"
ISAAC_ROS_WS_DIR_NAME="IsaacSim-ros_workspaces"
ISAAC_JAZZY_WS_NAME="isaac_jazzy_ws"
ISAAC_ROS_APT_PACKAGES=(
  python3-rosdep
  build-essential
  python3-colcon-common-extensions
)
