# FaSim-Isaac 共用配置（提交 git，bash 语法，由 init.sh / run.sh source）
# 本机覆盖：复制 fa_sim.local.template.conf 为 fa_sim.local.conf 后修改（已 gitignore）

# --- Isaac Sim 安装 / 启动（run.sh）---
# 允许环境变量优先：ISAACSIM_DIR=/path ./run.sh
ISAACSIM_DIR="${ISAACSIM_DIR:-${HOME}/isaacsim}"
ISAACSIM_LAUNCH_NORMAL="isaac-sim.sh"
ISAACSIM_LAUNCH_NEWTON="isaac-sim.newton.sh"
ISAACSIM_LAUNCH_STREAMING="isaac-sim.streaming.sh"
# 1=强制设置 CPU performance；0=跳过；auto=可用则设（容器内不尝试 apt 安装）
# distrobox 内调频由宿主机内核控制，推荐 auto 或 0；宿主机可执行:
#   sudo cpupower frequency-set -g performance
RUN_SET_CPU_PERFORMANCE="${RUN_SET_CPU_PERFORMANCE:-auto}"

# --- Headless Streaming 多实例（run.sh 选项 3）---
# FA_SIM_INSTANCE=N 时：
#   signalPort = STREAM_SIGNAL_PORT_BASE + N * STREAM_PORT_STEP
#   streamPort = STREAM_STREAM_PORT_BASE + N * STREAM_PORT_STEP
#   ROS_DOMAIN_ID = ROS_DOMAIN_ID_BASE + N
# 也可用环境变量覆盖，例如: FA_SIM_INSTANCE=1 ./run.sh 3
FA_SIM_INSTANCE="${FA_SIM_INSTANCE:-0}"
STREAM_SIGNAL_PORT_BASE="${STREAM_SIGNAL_PORT_BASE:-49100}"
STREAM_STREAM_PORT_BASE="${STREAM_STREAM_PORT_BASE:-47998}"
STREAM_PORT_STEP="${STREAM_PORT_STEP:-10}"
ROS_DOMAIN_ID_BASE="${ROS_DOMAIN_ID_BASE:-0}"

# --- Isaac ROS2 Workspace（init.sh）---
# 菜单查询远程失败时的备用版本列表（新 → 旧）
ISAAC_SIM_VERSIONS=(
  "6.0.1"
  "6.0.0"
  "5.1.0"
)
# 菜单展示的远程稳定版本数量（排除 -dev / -full 等后缀）
ISAAC_SIM_VERSION_MENU_COUNT="${ISAAC_SIM_VERSION_MENU_COUNT:-3}"
# 默认版本（菜单回车 / 未指定 ISAAC_SIM_VERSION 时使用）。
# 未设置时取解析后的版本列表第一项（通常是远程最新稳定版）。
# ISAAC_SIM_DEFAULT_VERSION="6.0.1"
ISAAC_ROS_WS_GIT_URL="${ISAAC_ROS_WS_GIT_URL:-https://github.com/isaac-sim/IsaacSim-ros_workspaces.git}"
ISAAC_ROS_WS_GIT_TIMEOUT="${ISAAC_ROS_WS_GIT_TIMEOUT:-30}"
ISAAC_ROS_WS_TAG_PREFIX="IsaacSim-"
# %s 会被替换为完整 tag，例如 IsaacSim-5.1.0
ISAAC_ROS_WS_ZIP_URL_TEMPLATE="https://github.com/isaac-sim/IsaacSim-ros_workspaces/archive/refs/tags/%s.zip"
ISAAC_ROS_WS_DIR_NAME="IsaacSim-ros_workspaces"
ISAAC_JAZZY_WS_NAME="isaac_jazzy_ws"
ISAAC_ROS_APT_PACKAGES=(
  python3-rosdep
  build-essential
  python3-colcon-common-extensions
)
