# 本机覆盖模板：复制为本目录下的 fa_sim.local.conf 后修改
#   cp config/fa_sim.local.template.conf config/fa_sim.local.conf
# fa_sim.local.conf 已 gitignore，不会提交

# 示例：自定义 Isaac Sim 安装路径
# ISAACSIM_DIR="${HOME}/isaacsim"

# 示例：覆盖默认版本（默认取 ISAAC_SIM_VERSIONS 第一项）
# ISAAC_SIM_DEFAULT_VERSION="5.1.0"
# ISAAC_SIM_VERSION="5.1.0"

# distrobox / 容器内：CPU 调频通常只能在宿主机设置
# RUN_SET_CPU_PERFORMANCE=auto   # 默认；容器内不 apt 安装 linux-tools
# RUN_SET_CPU_PERFORMANCE=0      # 完全跳过
# 宿主机手动设置示例：
#   sudo cpupower frequency-set -g performance

# Headless Streaming 多实例（默认端口与 Isaac Sim streaming.kit 一致）
# FA_SIM_INSTANCE=1              # 实例序号；也可用 ./run.sh 3 1
# STREAM_SIGNAL_PORT_BASE=49100  # WebRTC 信令 TCP
# STREAM_STREAM_PORT_BASE=47998  # 媒体 UDP
# STREAM_PORT_STEP=10            # 每实例端口步长
# ROS_DOMAIN_ID_BASE=0           # ROS_DOMAIN_ID = BASE + INSTANCE
