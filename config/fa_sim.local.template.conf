# 本机覆盖模板：复制为本目录下的 fa_sim.local.conf 后修改
#   cp config/fa_sim.local.template.conf config/fa_sim.local.conf
# fa_sim.local.conf 已 gitignore，不会提交
# ./run.sh / ./run_headless.sh 交互确认后也会写入上述键

# 示例：自定义 Isaac Sim 安装路径
# ISAACSIM_DIR="${HOME}/isaacsim"

# 示例：覆盖默认版本（未设置时取远程最新稳定版）
# ISAAC_SIM_DEFAULT_VERSION="5.1.0"
# ISAAC_SIM_VERSION="5.1.0"
# ISAAC_SIM_VERSION_MENU_COUNT=3

# 物理引擎：physx | newton
# RUN_PHYSICS_BACKEND=physx

# CPU 调频：1=强制 / 0=跳过 / auto=可用则设（容器内不 apt）
# RUN_SET_CPU_PERFORMANCE=auto
# 宿主机手动：
#   sudo cpupower frequency-set -g performance

# 启动前 source 的 ROS2 工作空间（robot description / robot_common_launch）
# RUN_ROS2_WS="${HOME}/ros2_ws"
# RUN_ROS2_WS=none
# Isaac jazzy underlay（默认自动用仓库内 isaac_jazzy_ws）
# RUN_ISAAC_ROS_WS="${HOME}/libraries/FaSim-Isaac/isaac_jazzy_ws"

# Headless Streaming 多实例
# FA_SIM_INSTANCE=1
# STREAM_SIGNAL_PORT_BASE=49100
# STREAM_STREAM_PORT_BASE=47998
# STREAM_PORT_STEP=10
# ROS_DOMAIN_ID_BASE=0
