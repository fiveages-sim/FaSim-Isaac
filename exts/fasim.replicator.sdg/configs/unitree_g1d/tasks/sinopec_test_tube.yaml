# Unitree G1D + Sinopec 试管抓取 —— 任务级配置
#
# 场景：FaSim-Isaac environment/fa-project-usd/Sinopec/2026-10 Test Tube Picking/env/G1D/room.usda
# 三个相机：头部 + 左右手腕（资产已确认存在，见下方 prim 路径）

task_key: sinopec_test_tube

# 相对 FaSim-Isaac 仓库根目录；也可写绝对路径
scene_usda: environment/fa-project-usd/Sinopec/2026-10 Test Tube Picking/env/G1D/room.usda

# 打开场景后要切的 variant（机器人在此场景里必须 ROS=fiveages 才有运控）
variant_selection:
  ROS: fiveages
  EE_Left: dex1
  EE_Right: dex1

# 除机器人外需要记录位姿的物体。
#
# 只录**会被机器人移动**的刚体：试管/架子是独立刚体，不受关节角驱动；
# 层2 回放必须逐帧 set_world_poses 还原它们，否则物体会停在初始位置
# 而手在做动作，画面完全错位。
#
# 不录 lab_table：桌面是静态网格（无 RigidBodyAPI），本就恒定不动。
# 硬录它只会浪费每帧一次服务调用（实测 4 个物体把采样从 50Hz 拖到 15Hz）。
#
# label 必须与 ee_traj.py 的 prim_label()（路径末段）一致，
# renderer 靠它把 npz 里的 obj/<label>_* 映射到 prim。
tracked_prims:
  test_tube: /World/room/scene/test_tube
  test_tube_rack: /World/room/scene/test_tube_rack
  test_tube_rack_01: /World/room/scene/test_tube_rack_01

# ---------------------------------------------------------------------------
# 运行时物体随机化（自动化采集用）
# ---------------------------------------------------------------------------
# 每轮采集前：先把物体**恢复到初始快照位姿**，再叠加随机偏移。
# （任务结尾物体位置和开头差很多 —— 被抓到手里/插进孔里 —— 直接对当前位置
#  加偏移会把物体甩飞。所以 restore-then-offset 是必须的。）
#
# 可行性先验证：./scripts/sdg.sh randomize-check
#
# 字段说明见 fasim/replicator/sdg/types.py 的 TaskSpec.randomize
randomize:
  seed: 0                 # 0 = 每次用时间戳
  settle_steps: 60        # 200Hz 下 60 步 = 0.3s，够物体落稳
  verify_tol_m: 0.05      # 读回验证容差
  objects:
    # ① 右手边的架子（**试管初始放在这个架子上**）
    #    实测：初始时试管离本架 24mm、离对面架 201mm。
    - prim: /World/room/scene/test_tube_rack_01
      axes: {x: 0.03, y: 0.03}
    # ② 左手边的空架子（任务终点：试管被插在这里）
    - prim: /World/room/scene/test_tube_rack
      axes: {x: 0.04, y: 0.03}
    # ③ 试管：**精确放进 01 号架的 hole_4**（用 place_on，不是 follow）
    #
    # 为什么必须 place_on：
    #   任务结束时试管已经被拿走/插到另一只架子上，所以「按当前相对位置
    #   平移」还原不出「在孔里」这个状态。
    #
    # 实现用的是「快照相对偏移」：
    #   试管目标位姿 = rack_01 当前位姿 + (试管快照 − rack_01 快照)
    # 这个相对偏移天然包含「管底比孔口低一个管长」的几何量，
    # 所以不需要 align 字段，也不需要知道 hole_4 的语义。
    #
    # 顺序天然正确：place_on 在 axes 之后执行，
    # 即「先随机架子，再按架子新位置放试管」。
    - prim: /World/room/scene/test_tube
      place_on:
        target: /World/room/scene/test_tube_rack_01
        frame: hole_4             # 仅用于「这个孔存在」的校验与日志
        offset: [0.0, 0.0, 0.0]   # 需要微调时在这里加（米）

# ---------------------------------------------------------------------------
# 任务完成判据（半自动数采用）
# ---------------------------------------------------------------------------
# 采集期间逐帧判断「试管是不是已经插进左侧架子的 hole_3」，结果写进
# session.json 的 stop_reason / done 字段。
#
# 为什么需要：
#   编排超时或插偏了照样会往下走、照样回 HOME —— 采到的是**失败轨迹**。
#   有了这个字段，事后 pack/训练前能一键筛掉失败数据
#   （stop_reason=task_completed 才是可信的）。
#
# 判据（三个条件同时满足）：
#   ① xy 水平距离 < xy_tol_m
#   ② dz（试管中心 − 孔底）<= dz_inside_mm
#   ③ 试管轴倾角 < max_tilt_deg
#
# **为什么必须有 z**：insert 技能是「悬停孔口上方 → 空中对齐 xy → 垂直下探」，
# 悬空对准时 xy 就已经接近 0（实测 0.15mm），但试管还在孔口上方 40mm。
# 只看 xy 会在下探前 3.5s 就误报完成。
#
# 实测 z 分布（41 个 run，全部真实插入）：
#   悬空对准: dz ≈ +40mm     ← 被排除
#   插到底:   dz ≈ -98~-102mm
# 取 -60mm 作分界，距两侧各留 40mm 余量。
#
# **关于 xy_tol_m 的教训**：第一版设 20mm，理由是「41 条里 39 条 ≤20mm」。
# 那是错的 —— dxy 分布**连续**（0.65~21.82mm），最大相邻间隔只 2.01mm，
# 没有任何自然分界。被砍掉的 2 条（21.82/20.67mm）倾角仅 13.6°/12.9°、
# dz 都是 -98mm，**和其他一样真的插进去了**，只是落在孔的边缘。
# xy 阈值的作用是「防止把别的孔/架外当成目标孔」（孔间距约 30mm），
# 不是「判断偏多少算失败」。所以放宽到 25mm。
#
# 识别「插歪/碰倒」靠 max_tilt_deg：正常插入 0.85~13.62°，碰倒 >45°。
#
# 验证：xy<25mm 且 dz<-60mm 且 tilt<30° → 41/41 全部判定成功。

done_when:
  object: test_tube
  rack: test_tube_rack
  hole_offset: [-0.021, -0.010, 0.110]   # hole_3 在 rack 局部系（资产常量）
  xy_tol_m: 0.025                        # 只用于排除「别的孔」，非精度要求
  dz_inside_mm: -60.0                    # 试管中心相对孔底的高度上限
  max_tilt_deg: 30.0                     # 倾角上限（识别碰倒/横躺）
  consecutive_frames: 8                  # 连续 8 帧(0.4s)满足才算，防抖
  stop_on_complete: false

# ---------------------------------------------------------------------------
# 相机
# ---------------------------------------------------------------------------
# prim 路径说明：
#   头部 d435_link/head_camera —— G1_Body 的 Sensor=sensors 变体提供
#   手腕 dex1_{left,right}_camera —— Dex1 的 Sensor=camera 变体提供
#     （G1D 的 EE_Left/EE_Right=dex1 已经把 Dex1 的 Sensor 固定为 camera）
# 若某个 prim 在 stage 中不存在，capture 会报错并列出候选路径。
cameras:
  - name: head
    prim: /World/G1D/G1_Body/torso_link/d435_link/head_camera
    resolution: [640, 480]
    annotators: [rgb, camera_params]
    depth: true

  - name: wrist_left
    prim: /World/G1D/G1_Arms/left_wrist_yaw_link/left_tcp/Dex1/Geometry/dex1_base_link/dex1_camera_link/dex1_camera_optical_frame/dex1_left_camera
    resolution: [640, 480]
    annotators: [rgb, camera_params]
    depth: true

  - name: wrist_right
    prim: /World/G1D/G1_Arms/right_wrist_yaw_link/right_tcp/Dex1/Geometry/dex1_base_link/dex1_camera_link/dex1_camera_optical_frame/dex1_right_camera
    resolution: [640, 480]
    annotators: [rgb, camera_params]
    depth: true

# 可选：再生成一个第三人称机位（场景里没有就现场创建）
# - name: third_person
#   create:
#     position: [2.6, -0.9, 1.5]
#     look_at: [1.8, 0.25, 0.88]
#   resolution: [640, 480]
#   annotators: [rgb]
#   depth: true

# ---------------------------------------------------------------------------
# 输出（与 _default.yaml 的 output.dir 拼接为 <dir>/<robot>/<task>/）
# ---------------------------------------------------------------------------
output:
  # 必须与 runtime.data_root() 一致（默认 ~/fasim_data）！
  #
  # 这里踩过坑：原来写的是 /home/fiveages/fasim_sdg，而 capture 的默认输出
  # 走 runtime.default_session_dir() = ~/fasim_data/<robot>/<task>。
  # 结果「初始位姿快照」被写到 ~/fasim_sdg/...，采集数据写到 ~/fasim_data/...，
  # 随机化读到的是另一份快照 —— 表现为「随机化结果和预期不符」而且很难查。
  #
  # 若要用别的目录，改这里的同时也要设 FASIM_SDG_DATA 环境变量，
  # 让 runtime.data_root() 跟着变（或者统一用 --out 显式指定）。
  dir: /home/fiveages/fasim_data

record:
  capture_fps: 30
  # ---------------------------------------------------------------------------
  # 物理步频（设定值）—— 必须与场景 USD 的 physxScene:timeStepsPerSecond 一致。
  # 本任务场景 room.usda 里是 200，所以 dt=5ms。
  #
  # *** 设定值 vs 实际值 ***
  #   设定值 200Hz：仿真时间口径，决定帧率与时间轴（every 后的帧率 = 200/every）。
  #   实际值 ~177Hz：墙钟每秒真跑多少步，受本机性能限制，只影响跑多快、不改时间轴。
  # 采集时会读场景实际配置值与此处对账，不一致会 WARN（以场景为准）。
  # ---------------------------------------------------------------------------
  physics_hz: 200
  physics_dt: 0.005      # 200Hz 的步长写法（与 physics_hz 等价，后者优先）
  max_frames: 2000

# ---------------------------------------------------------------------------
# 采集预设 —— 保证多批次数据格式对齐
# ---------------------------------------------------------------------------
# 同一任务要采几十条轨迹（ACT 训练用）。每次手选参数容易某次改错一个值，
# 那一批数据就和之前不兼容了（导出时 capture_profile 会拦，但白采了）。
# 预设把参数固化成名字，选一次即可。
#
# target_fps: 按本任务 physics_hz(200) 自动换算 every，比手写 every 稳
#             （换场景步频改了也不会错）。
# every:      直接给物理步数（与 target_fps 二选一，every 优先）。
#
capture_presets:
  # ACT 训练主力：20fps、原分辨率 640x480、全字段
  act_train:
    desc: "ACT 训练（20fps / 640x480 / camera+joint+ee+object）"
    what: [camera, joint, ee, object]
    camera: all
    target_fps: 20
    depth: true

  # 高分辨率：想提升视觉细节时用（显存/时间开销大 3 倍）
  act_hires:
    desc: "ACT 高分辨率（15fps / 1280x720）"
    what: [camera, joint, ee, object]
    camera: all
    target_fps: 15
    width: 1280
    height: 720
    depth: true

  # 快速冒烟：只验证流水线通不通，省时间省磁盘
  smoke:
    desc: "冒烟测试（10fps / 320x240 / 无深度）"
    what: [camera, joint]
    camera: head
    target_fps: 10
    width: 320
    height: 240
    depth: false
