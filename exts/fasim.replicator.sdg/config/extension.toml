[package]
version = "1.0.0"
category = "Simulation"
title = "FaSim Replicator SDG"
description = "Bypass synthetic-data capture for FaSim robots: while a task orchestration runs in Isaac Sim, records camera RGB-D (with intrinsics/pose), joint angles (measured + commanded), end-effector poses (measured + commanded) and rigid-body object poses on the physics-step callback. Does not take over control and adds no threads. Includes a 7-point data health check, camera contact sheets, LeRobot dataset export, and same-instance replay (joints or end-effector -> OCS2)."
authors = ["FiveAges"]
keywords = ["isaac", "replicator", "sdg", "synthetic-data", "dataset", "lerobot", "imitation-learning"]

[dependencies]
"omni.replicator.core" = {}
# 层2 离线录制（sdg.sh record）用到 EpisodeRecorder；实时旁路采集（capture）不需要。
"isaacsim.replicator.episode_recorder" = {}
"isaacsim.core.prims" = {}
"isaacsim.core.utils" = {}

[[python.module]]
name = "fasim.replicator.sdg"

# 随 Isaac Sim 自动加载：起一个 app-update 回调，通过 Unix domain socket
# （<runtime>/capture.sock）接受终端侧 sdg.sh 的指令，实现"仿真跑编排时旁路采数"。
# 见 fasim/replicator/sdg/scripts/extension.py。

[[python.module]]
name = "fasim.replicator.sdg.scripts.extension"

[fswatcher.patterns]
include = ["*.py", "*.yaml", "*.md"]
exclude = ["__pycache__"]
